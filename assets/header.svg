<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Solène Bloret — Développeuse Full Stack, Nantes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="blob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7C4"/>
      <stop offset="1" stop-color="#FDD5E8"/>
    </linearGradient>
    <style>
      .script { font-family: 'Segoe Script','Brush Script MT','Snell Roundhand','Apple Chancery',cursive; font-size: 58px; fill: #F59AC6; }
      .name { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 800; font-size: 46px; fill: #2E2A3D; letter-spacing: 1px; }
      .role { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; font-size: 22px; fill: #5B5670; }
      .tag  { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-style: italic; font-size: 17px; fill: #5B5670; }
      .pill { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; font-size: 13px; fill: #2E2A3D; }
      @media (prefers-reduced-motion: no-preference) {
        .float { animation: float 6s ease-in-out infinite; }
        .float2 { animation: float 7s ease-in-out infinite reverse; }
      }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
  </defs>
  <rect width="1200" height="270" rx="18" fill="#FFFCF7"/>
  <path d="M18 0 H250 C360 0 430 59 430 135 C430 211 360 270 250 270 H18 A18 18 0 0 1 0 252 V18 A18 18 0 0 1 18 0 Z" fill="url(#blob)"/>
  <circle class="float" cx="405" cy="75" r="46" fill="#C9CEF0" opacity="0.9"/>
  <circle class="float2" cx="428" cy="150" r="15" fill="#FFCF8A"/>
  <circle class="float" cx="385" cy="210" r="26" fill="#C4EEDC" opacity="0.95"/>
  <text x="480" y="92" class="script">Solène</text>
  <text x="480" y="145" class="name">BLORET</text>
  <text x="480" y="190" class="role">Développeuse Full Stack · Nantes</text>
  <text x="480" y="226" class="tag">Construire des applications utiles qui répondent à de vrais besoins utilisateurs.</text>
  
